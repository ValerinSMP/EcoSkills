name: Build
on:
  push:
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.gradle'
      - '**/*.properties'
      - '**/src/main/resources/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.gradle'
      - '**/*.properties'
      - '**/src/main/resources/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --full-stacktrace